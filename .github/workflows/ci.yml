name: Raritone CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/raritone-mobile-client

permissions:
  contents: read

jobs:
  sdk:
    name: SDK build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  mobile:
    name: Mobile typecheck and bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: npx expo export --platform android
        working-directory: mobile
      - run: npx expo export --platform ios
        working-directory: mobile

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
        working-directory: backend
      - run: python -m pytest -q tests
        working-directory: backend
